name: Bug report
description: Something in core, the Malanta provider, or the generic-adapter engine isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! If this is about a **specific third-party vendor config** (not the generic engine itself), please use the "Provider config issue" template instead — it's triaged differently (see SUPPORT.md).

        **Security vulnerability?** Do not file it here — see [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including whether it caused a false ALLOW (bypass) or false DENY (false positive).
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal command/payload that triggers it. Redact any secrets, real hostnames belonging to third parties, or customer data.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected area
      placeholder: "e.g. internal/extract/shell.go, internal/reputation Malanta provider, beforeShellExecution hook"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which reputation provider are you using?
      options:
        - malanta (default)
        - generic (config-driven)
        - n/a
    validations:
      required: true
